<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prime Scale Admin</title>
<link rel="icon" href="/images/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a14; --panel: #0d1424; --raised: #131e36; --line: #1d2a47;
    --text: #e9eefc; --muted: #8d9bb8;
    --blue: #3b8ef0; --blue-ink: #06101f; --amber: #c4800f;
    --good: #3fb27f; --warn: #e0a02a; --bad: #ef5a5f;
    --font: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --display: 'Unbounded', 'Hanken Grotesk', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Buttons & fields */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 14px; text-decoration: none; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
  .btn.primary:hover { background: #5aa2f5; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  input[type=text], input[type=password], input[type=search], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
  label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(700px 400px at 50% -10%, rgba(59,142,240,.22), transparent 70%); }
  .login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; }
  .login-card img { width: 88px; height: 88px; border-radius: 50%; display: block; margin: 0 auto 18px; }
  .login-card h1 { font: 600 20px/1.2 var(--display); text-align: center; margin: 0 0 6px; }
  .login-card p.sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .login-card .field { margin-bottom: 14px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 4px 0 10px; }

  /* Shell */
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(6,10,20,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--display); text-decoration: none; }
  .brand img { width: 36px; height: 36px; border-radius: 50%; }
  .tabs { display: flex; gap: 4px; margin-left: 12px; }
  .tab { position: relative; background: none; border: 0; padding: 9px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected=true] { color: var(--text); background: var(--raised); }
  .badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 7px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; }
  .spacer { flex: 1; }
  .snd { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
  h2.page { font: 600 22px/1.2 var(--display); margin: 0 0 18px; }
  h3.sec { font: 600 15px/1.3 var(--display); margin: 0 0 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .muted { color: var(--muted); }

  /* Banners */
  .banner { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid; font-size: 14px; }
  .banner.bad { background: rgba(239,90,95,.1); border-color: rgba(239,90,95,.5); }
  .banner.warn { background: rgba(224,160,42,.1); border-color: rgba(224,160,42,.5); }
  .banner b { display: block; margin-bottom: 2px; }

  /* Overview */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .kpi b { display: block; font: 600 30px/1.1 var(--display); letter-spacing: -0.02em; }
  .kpi span { display: block; margin-top: 6px; color: var(--muted); font-size: 13.5px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .legend { display: flex; gap: 16px; font-size: 13.5px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 3; }
  .tip b { display: block; margin-bottom: 3px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th, table.data td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  table.data th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 44px; gap: 10px; align-items: center; font-size: 14px; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; }
  .bar-row .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .feed li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .feed li:last-child { border-bottom: 0; }
  .dot { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); font-size: 13px; }
  .feed time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

  /* Appointments */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .chip[aria-pressed=true] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
  .toolbar input[type=search] { max-width: 260px; margin-left: auto; }
  .appt { display: grid; grid-template-columns: 1.1fr 1.5fr 1fr 150px auto; gap: 16px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .appt:last-child { border-bottom: 0; }
  .appt .when b { display: block; font-size: 15px; }
  .appt .who b { display: block; }
  .appt .who a { color: var(--muted); font-size: 13.5px; text-decoration: none; word-break: break-all; }
  .appt .who a:hover { color: var(--text); text-decoration: underline; }
  .appt .meta { font-size: 13px; color: var(--muted); }
  .appt .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  select.status { padding: 8px 10px; font-weight: 600; font-size: 13.5px; }
  select.status[data-s=new] { border-color: var(--warn); color: var(--warn); }
  select.status[data-s=confirmed] { border-color: var(--blue); color: var(--blue); }
  select.status[data-s=done] { border-color: var(--good); color: var(--good); }
  select.status[data-s=cancelled] { border-color: var(--muted); color: var(--muted); }

  /* Chats */
  .chat-wrap { display: grid; grid-template-columns: 340px 1fr; gap: 16px; height: calc(100vh - 170px); min-height: 520px; }
  .clist, .thread { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .clist-body { overflow-y: auto; flex: 1; }
  .citem { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; }
  .citem:hover { background: var(--raised); }
  .citem[aria-current=true] { background: var(--raised); box-shadow: inset 3px 0 0 var(--blue); }
  .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #1f6fd1, #19a0d8); display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
  .citem .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .citem .pv { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .citem .tm { font-size: 12px; color: var(--muted); text-align: right; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .tag.need { background: rgba(239,90,95,.18); color: var(--bad); }
  .tag.you { background: rgba(59,142,240,.18); color: var(--blue); }
  .tag.ai { background: rgba(63,178,127,.16); color: var(--good); }
  .thread-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .thread-head .ti { flex: 1; min-width: 180px; }
  .thread-head .ti b { display: block; }
  .thread-head .ti span { font-size: 13px; color: var(--muted); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .b { max-width: 78%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; }
  .b small { display: block; font-size: 11.5px; opacity: .7; margin-top: 4px; }
  .b.visitor { align-self: flex-start; background: var(--raised); border-bottom-left-radius: 4px; }
  .b.ai { align-self: flex-start; background: rgba(59,142,240,.12); border: 1px solid rgba(59,142,240,.3); border-bottom-left-radius: 4px; }
  .b.admin { align-self: flex-end; background: var(--blue); color: var(--blue-ink); border-bottom-right-radius: 4px; }
  .b .who { font-size: 11.5px; font-weight: 700; display: block; margin-bottom: 3px; opacity: .75; }
  .composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { resize: none; min-height: 44px; max-height: 120px; }
  .placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 280px; padding: 20px; }
  .status-line { font-size: 13px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--raised); }
  .status-line b { font-variant-numeric: tabular-nums; }
  .back { display: none; }

  /* Settings */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .scard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .scard h4 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .scard b { font: 600 17px var(--display); display: block; margin-bottom: 6px; }
  .scard p { margin: 0; color: var(--muted); font-size: 14px; }
  .ok { color: var(--good); } .no { color: var(--bad); } .mid { color: var(--warn); }
  ol.steps { padding-left: 20px; margin: 8px 0 0; color: var(--muted); font-size: 14.5px; }
  ol.steps li { margin: 6px 0; }
  code { background: var(--raised); padding: 2px 6px; border-radius: 6px; font-size: 13px; color: var(--text); }

  @media (max-width: 960px) {
    .appt { grid-template-columns: 1fr 1fr; }
    .appt .acts { justify-content: flex-start; grid-column: 1 / -1; }
  }
  @media (max-width: 820px) {
    .top-in { height: auto; padding: 10px 16px; flex-wrap: wrap; row-gap: 8px; }
    .tabs { order: 3; width: 100%; margin: 0; overflow-x: auto; }
    .snd { display: none; }
    main { padding: 18px 14px 80px; }
    .chat-wrap { grid-template-columns: 1fr; height: calc(100vh - 190px); }
    .chat-wrap .thread { display: none; }
    .chat-wrap.show-thread .clist { display: none; }
    .chat-wrap.show-thread .thread { display: flex; }
    .back { display: inline-flex; }
    .b { max-width: 90%; }
    .toolbar input[type=search] { max-width: none; margin-left: 0; width: 100%; }
  }
  @media (max-width: 520px) {
    .appt { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="/images/logo-112.png" alt="Prime Scale logo" width="88" height="88">
    <h1>Prime Scale Admin</h1>
    <p class="sub">Sign in to see appointments, chats and site analytics.</p>
    <div class="field" style="margin-bottom:14px"><label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" style="width:100%;padding:12px" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/admin/"><img src="/images/logo-112.png" alt="" width="36" height="36">Prime Scale</a>
      <nav class="tabs" role="tablist" aria-label="Admin sections">
        <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button class="tab" role="tab" data-tab="appts" aria-selected="false">Appointments<span class="badge" id="bAppts" hidden>0</span></button>
        <button class="tab" role="tab" data-tab="chats" aria-selected="false">Chats<span class="badge" id="bChats" hidden>0</span></button>
        <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
      </nav>
      <div class="spacer"></div>
      <label class="snd"><input type="checkbox" id="snd" checked> Sound on new message</label>
      <a class="btn sm" href="/" target="_blank" rel="noopener">View site</a>
      <button class="btn sm" id="logout" type="button">Log out</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var state = { tab: 'overview', me: null, timers: [], chatId: null, lastUnread: 0, apptFilter: 'all', apptQ: '', appts: [], chartMode: 'chart' };

  /* ---------- helpers ---------- */
  function h(tag, props) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) { var c = kids[j]; if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); }
    }
    return e;
  }
  function api(action, data) {
    var body = Object.assign({ action: action }, data || {});
    return fetch('/api/admin', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) { showLogin(); throw new Error('login'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Request failed'); return j; });
      });
  }
  function clearTimers() { state.timers.forEach(clearInterval); state.timers = []; }
  function every(ms, fn) { state.timers.push(setInterval(function () { if (!document.hidden) fn(); }, ms)); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function t12(t) { var p = t.split(':'); var hh = +p[0]; return ((hh % 12) || 12) + ':' + p[1] + ' ' + (hh >= 12 ? 'PM' : 'AM'); }
  function dLabel(iso) { var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function rel(ts) {
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    var d = new Date(ts); return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function clock(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function wa(phone) { var d = String(phone).replace(/\D/g, ''); if (d.charAt(0) === '0') d = '63' + d.slice(1); return 'https://wa.me/' + d; }
  function n(x) { return Number(x || 0).toLocaleString(); }
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      var c = new C(), o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, c.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.4);
    } catch (e) { /* ignore */ }
  }

  /* ---------- login ---------- */
  function showLogin() { clearTimers(); $('#app').hidden = true; $('#login').hidden = false; document.title = 'Sign in | Prime Scale Admin'; }
  function showApp() { $('#login').hidden = true; $('#app').hidden = false; }
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
    fetch('/api/admin', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', user: $('#u').value, pass: $('#p').value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not sign in.'); }); })
      .then(function () { $('#p').value = ''; boot(); })
      .catch(function (err) { $('#loginErr').textContent = err.message; })
      .then(function () { btn.disabled = false; });
  });
  $('#logout').addEventListener('click', function () { api('logout').catch(function () {}).then(showLogin); });

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-tab')); }); });
  function go(tab) {
    state.tab = tab; clearTimers(); startBadges();
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    var v = $('#view'); v.textContent = '';
    ({ overview: renderOverview, appts: renderAppts, chats: renderChats, settings: renderSettings })[tab](v);
  }
  function startBadges() {
    var tick = function () {
      api('badges').then(function (b) {
        setBadge($('#bAppts'), b.newAppts); setBadge($('#bChats'), b.unreadChats);
        document.title = (b.unreadChats + b.newAppts > 0 ? '(' + (b.unreadChats + b.newAppts) + ') ' : '') + 'Prime Scale Admin';
        if (b.unreadMsgs > state.lastUnread && $('#snd').checked) beep();
        state.lastUnread = b.unreadMsgs;
      }).catch(function () {});
    };
    tick(); every(15000, tick);
  }
  function setBadge(el, v) { el.hidden = !v; el.textContent = v; }

  /* ---------- overview ---------- */
  function banners(me) {

        h('div', { class: 'panel', style: 'margin-top:16px' }, h('h3', { class: 'sec', text: 'Turn on free-form AI answers (optional)' }), h('ol', { class: 'steps' },
          h('li', null, 'Create an API key at console.anthropic.com. API use is billed by Anthropic, usually a few cents for a small site.'),
          h('li', null, 'Add it in Vercel as the environment variable ', h('code', { text: 'ANTHROPIC_API_KEY' }), ' and redeploy.'))));
    }).catch(function () {});
  }

  /* ---------- boot ---------- */
  function boot() {
    api('me').then(function (me) { state.me = me; showApp(); go(state.tab); }).catch(function (e) { if (e.message === 'login') showLogin(); });
  }
  boot();
})();
</script>
</body>
</html>
